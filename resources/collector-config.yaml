receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
  transform:
    trace_statements:
      - set(
          span.attributes["http.url"],
          Concat([
            span.attributes["url.scheme"],
            "://",
            span.attributes["server.address"],
            span.attributes["url.path"],
            "?",
            span.attributes["url.query"]
          ], "")
        )
        where span.attributes["url.query"] != nil and span.attributes["url.query"] != ""

extensions:
  health_check:
    endpoint: "0.0.0.0:13133"
    path: "/health"
    response_body:
      healthy: "UP"
      unhealthy: "DOWN"

exporters:
  debug:
    verbosity: detailed

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch,transform]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
